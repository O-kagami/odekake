<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown 練習室</title><style>body{font-family:system-ui,'Yu Gothic',sans-serif;margin:0;background:#f5f6f8;color:#202631}main{max-width:600px;margin:auto;padding:28px}h1{font-size:28px}textarea{box-sizing:border-box;width:100%;height:260px;padding:18px;font:16px/1.6 Consolas,monospace;border:1px solid #bbc3ce;border-radius:8px}article{padding:12px 22px;background:white;border:1px solid #d9dee5;border-radius:8px}pre{padding:16px;background:#ecf0f5;white-space:pre-wrap}button{background:#202631;color:white;border:0;border-radius:6px;padding:10px 18px;margin:14px 0;font:inherit}p{line-height:1.7}small{color:#657080}a{color:#185bb4}table{border-collapse:collapse}td,th{border:1px solid #cbd0d5;padding:8px}code{background:#eef0f4}</style></head><body><main><small>AIアプリ制作講座のローカル教材</small><h1>Markdown 練習室</h1><label for="source">Markdownの入力</label><textarea id="source"># おでかけノート

## できること
- 持ち物をチェックする
- **チェック状態を保存する**

## 完成条件
- [x] ボタンが動く
- [ ] スマホで確認する</textarea><button id="render">プレビューを更新</button><article id="preview"></article><p><small>この学習用プレビューは基本構文のみ対応。GitHubの表示とは細部が異なります。</small></p></main><script>const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');const inline=s=>esc(s).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2">$1</a>');function render(){let code=false,out='';for(const line of document.querySelector('#source').value.split('\n')){if(line.startsWith('```')){out+=code?'</code></pre>':'<pre><code>';code=!code;continue}if(code){out+=esc(line)+'\n';continue}if(/^### /.test(line))out+='<h3>'+inline(line.slice(4))+'</h3>';else if(/^## /.test(line))out+='<h2>'+inline(line.slice(3))+'</h2>';else if(/^# /.test(line))out+='<h1>'+inline(line.slice(2))+'</h1>';else if(/^- \[[ x]\]/.test(line))out+='<p>'+(line[3]==='x'?'☑':'☐')+' '+inline(line.slice(6))+'</p>';else if(/^- /.test(line))out+='<p>・'+inline(line.slice(2))+'</p>';else if(line.trim())out+='<p>'+inline(line)+'</p>';}document.querySelector('#preview').innerHTML=out+(code?'</code></pre>':'')}document.querySelector('#render').addEventListener('click',render);render();</script></body></html>
